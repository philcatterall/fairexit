<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><defs><pattern id="removed" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path stroke="#ffffff40" stroke-width="2" d="M0 0v12"/></pattern></defs><path fill="#fff" d="M0 0h1200v630H0z"/><path fill="#102747" d="M780 0h420v630H780z"/><path fill="#2456d9" d="M0 0h1200v8H0z"/><g font-family="Arial,sans-serif" fill="#102747"><text x="58" y="71" font-size="22" font-weight="bold" letter-spacing="1">A FAIR EXIT.</text><g font-family="Impact,Arial,sans-serif" font-weight="bold" font-size="108" letter-spacing="-2"><text x="53" y="231">ENOUGH</text><text x="53" y="357" fill="#2456d9">IS ENOUGH.</text></g><text x="58" y="430" font-size="27">First: the tax rate rose from 10% to 18%.</text><text x="58" y="475" font-size="27">Now: plans to halve the BADR lifetime limit.</text><text x="58" y="574" font-size="20" font-weight="bold" fill="#2456d9" letter-spacing="1">HELP STOP THE CUT.  ↗  FAIREXIT.ORG</text></g><g font-family="Arial,sans-serif" fill="#fff"><text x="823" y="95" font-size="14" letter-spacing="2" font-weight="bold">THE BADR LIFETIME LIMIT</text><text x="816" y="285" fill="#86b5ff" font-family="Impact,Arial,sans-serif" font-size="163" font-weight="bold">50%</text><text x="827" y="354" font-family="Impact,Arial,sans-serif" font-size="62">CUT.</text><text x="826" y="421" font-size="24" font-weight="bold">£1 million → £500,000</text><path fill="#86b5ff" d="M826 452h150v26H826z"/><path fill="url(#removed)" stroke="#ffffff50" d="M980 452h150v26H980z"/><text x="826" y="548" font-size="14" letter-spacing=".4">ANNOUNCED FOR APRIL 2027</text><text x="826" y="575" font-size="13" fill="#c3d1e3">A halving of eligible gains, not the tax rate.</text></g></svg>